<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Журнал</title>
<style>
:root {
  --bg:#f2f2f7; --card:#fff; --card2:#f9f9f9;
  --fg:#1c1c1e; --fg2:#6c6c70; --fg3:#aeaeb2;
  --sep:#e5e5ea; --accent:#007aff; --accent-bg:#e8f0fe;
  --green-bg:#d4edda; --green-fg:#1a7f37;
  --red-bg:#fde8e8;   --red-fg:#c0392b;
  --amber-bg:#fff3cd; --amber-fg:#856404;
  --excel-bg:#d4f5d4; --excel-fg:#0a6e0a;
  --good-bg:#c8f5c8;  --good-fg:#155724;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --radius:12px; --radius-sm:8px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#1c1c1e; --card:#2c2c2e; --card2:#3a3a3c;
  --fg:#f2f2f7; --fg2:#aeaeb2; --fg3:#636366;
  --sep:#38383a; --accent:#0a84ff; --accent-bg:#1a2a4a;
  --green-bg:#1e3a2a; --green-fg:#4cd964;
  --red-bg:#3a1a1a;   --red-fg:#ff6b6b;
  --amber-bg:#3a3010; --amber-fg:#ffd60a;
  --excel-bg:#1a3a1a; --excel-fg:#4cd964;
  --good-bg:#1a3a1a;  --good-fg:#4cd964;
}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:16px}
body{display:flex;flex-direction:column;
  padding-top:var(--safe-t);padding-bottom:var(--safe-b)}

/* NAV BAR */
.navbar{background:var(--card);border-bottom:0.5px solid var(--sep);
  padding:10px 16px;display:flex;align-items:center;gap:8px;
  position:sticky;top:var(--safe-t);z-index:100;flex-shrink:0;min-height:52px}
.nav-back{color:var(--accent);font-size:15px;cursor:pointer;
  padding:4px 8px 4px 0;display:none;align-items:center;gap:4px;white-space:nowrap}
.nav-back.show{display:flex}
.nav-title{font-size:17px;font-weight:600;flex:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-sync{font-size:12px;color:var(--fg2);white-space:nowrap}
.nav-btn{background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);
  padding:6px 12px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}

/* TABS */
.tabs{display:flex;background:var(--card);border-bottom:0.5px solid var(--sep);
  flex-shrink:0;overflow-x:auto}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1;min-width:80px;padding:10px 4px;text-align:center;
  font-size:13px;cursor:pointer;color:var(--fg2);
  border-bottom:2px solid transparent;white-space:nowrap}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}

/* PAGE */
.page{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.section{padding:12px 16px}

/* GROUP LIST */
.group-card{background:var(--card);border-radius:var(--radius);
  padding:14px 16px;margin-bottom:10px;
  display:flex;align-items:center;justify-content:space-between;cursor:pointer;
  box-shadow:0 1px 3px rgba(0,0,0,.06)}
.group-card.active{background:var(--accent-bg);outline:2px solid var(--accent)}
.group-name{font-weight:600;font-size:15px}
.group-meta{font-size:12px;color:var(--fg2);margin-top:2px}
.group-arrow{color:var(--fg3);font-size:20px;margin-left:8px}

/* LESSON PICKER */
.lesson-wrap{background:var(--card);border-radius:var(--radius);
  padding:4px 12px;margin-bottom:12px;
  box-shadow:0 1px 3px rgba(0,0,0,.06)}
.lesson-select{width:100%;padding:10px 0;border:none;background:transparent;
  color:var(--fg);font-size:15px;cursor:pointer;appearance:none;
  -webkit-appearance:none;outline:none}

/* STUDENT ROWS */
.stu-card{background:var(--card);border-radius:var(--radius);
  padding:12px 14px;margin-bottom:8px;
  display:flex;align-items:center;gap:10px;
  box-shadow:0 1px 3px rgba(0,0,0,.06)}
.stu-num{color:var(--fg3);font-size:13px;width:20px;text-align:right;flex-shrink:0}
.stu-name{flex:1;font-size:15px;line-height:1.3}
.stu-star{color:#f1c40f;margin-right:3px;font-size:14px}

/* ATTENDANCE BUTTONS */
.att-wrap{display:flex;gap:6px;flex-shrink:0}
.att-btn{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--sep);
  background:var(--card2);color:var(--fg2);
  font-size:14px;font-weight:700;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:all .15s}
.att-btn.ap{background:var(--green-bg);color:var(--green-fg);border-color:var(--green-fg)}
.att-btn.an{background:var(--red-bg);  color:var(--red-fg); border-color:var(--red-fg)}
.att-btn.ao{background:var(--amber-bg);color:var(--amber-fg);border-color:var(--amber-fg)}

/* SAVE BAR */
.save-bar{position:sticky;bottom:0;background:var(--bg);
  padding:10px 16px calc(10px + var(--safe-b));
  border-top:0.5px solid var(--sep);display:none}
.save-bar.show{display:block}
.save-bar button{width:100%;padding:14px;border-radius:var(--radius);border:none;
  background:var(--accent);color:#fff;font-size:16px;font-weight:600;cursor:pointer}

/* GRADES TABLE */
.grades-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;
  background:var(--card);border-radius:var(--radius);
  box-shadow:0 1px 3px rgba(0,0,0,.06)}
.grades-table{width:100%;border-collapse:collapse;font-size:13px}
.grades-table th{background:var(--card2);padding:10px 10px;text-align:center;
  border-bottom:0.5px solid var(--sep);font-weight:600;
  color:var(--fg2);white-space:nowrap;font-size:12px}
.grades-table th:first-child,.grades-table th:nth-child(2){text-align:left}
.grades-table td{padding:9px 10px;border-bottom:0.5px solid var(--sep);
  text-align:center;vertical-align:middle}
.grades-table td:nth-child(2){text-align:left;font-size:14px}
.grades-table tr:last-child td{border-bottom:none}
.badge{display:inline-block;padding:3px 9px;border-radius:20px;
  font-size:12px;font-weight:600;white-space:nowrap}

/* ATTESTATION */
.month-section{margin-bottom:16px}
.month-title{font-size:13px;font-weight:700;color:var(--fg2);
  text-transform:uppercase;letter-spacing:.05em;
  padding:8px 0 6px;margin-bottom:6px;
  border-bottom:0.5px solid var(--sep)}
.att-row{background:var(--card);border-radius:var(--radius);
  padding:11px 14px;margin-bottom:7px;
  display:flex;align-items:center;gap:10px;
  box-shadow:0 1px 3px rgba(0,0,0,.06)}
.att-row .stu-name{font-size:14px}
.att-cell{flex-shrink:0;text-align:right}

/* MISC */
.empty{text-align:center;padding:60px 20px;color:var(--fg2);font-size:15px}
.cfg-wrap{padding:20px 16px}
.cfg-card{background:var(--card);border-radius:var(--radius);padding:20px;
  box-shadow:0 1px 3px rgba(0,0,0,.06)}
.cfg-card h2{font-size:18px;font-weight:700;margin-bottom:6px}
.cfg-card p{font-size:13px;color:var(--fg2);margin-bottom:16px}
.cfg-label{font-size:12px;font-weight:600;color:var(--fg2);
  text-transform:uppercase;letter-spacing:.04em;margin:14px 0 5px}
.cfg-input{width:100%;padding:12px;border-radius:var(--radius-sm);
  border:1px solid var(--sep);background:var(--card2);
  color:var(--fg);font-size:14px;outline:none}
.cfg-btn{margin-top:18px;width:100%;padding:14px;border-radius:var(--radius);
  border:none;background:var(--accent);color:#fff;
  font-size:16px;font-weight:600;cursor:pointer}
</style>
</head>
<body>

<div class="navbar">
  <div class="nav-back" id="navBack" onclick="goBack()">‹ Группы</div>
  <div class="nav-title" id="navTitle">Журнал</div>
  <div class="nav-sync" id="navSync"></div>
  <button class="nav-btn" onclick="syncNow()">⟳</button>
</div>

<div class="tabs" id="tabs" style="display:none">
  <div class="tab active" data-tab="att"  onclick="showTab('att',this)">📅 Посещаемость</div>
  <div class="tab"        data-tab="grd"  onclick="showTab('grd',this)">⭐ Оценки</div>
  <div class="tab"        data-tab="rep"  onclick="showTab('rep',this)">📊 Аттестация</div>
</div>

<div class="page" id="page"></div>
<div class="save-bar" id="saveBar">
  <button id="saveBtn" onclick="saveAttendance()">💾 Сохранить</button>
</div>

<script>
// ── Config ──────────────────────────────────────────────────────────────────
const CFG_KEY = 'sb_cfg_v2';
const DEFAULTS = {
  url: 'https://iccmfopkvwblisbxaoqe.supabase.co',
  key: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImljY21mb3BrdndibGlzYnhhb3FlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0MDU2NjAsImV4cCI6MjEwNjk4MTY2MH0.9Pd79I4sGjxm9zV7xV6jX1pD7cpJlZ-Kk4zMSKvQnNI'
};
let CFG = {...DEFAULTS, ...JSON.parse(localStorage.getItem(CFG_KEY)||'{}')};

// ── State ───────────────────────────────────────────────────────────────────
let DATA     = null;
let GROUP    = null;
let LESSON   = null;
let PENDING  = {};
let CUR_TAB  = 'att';
let ATT_THR  = 50; // % порог неаттестации

// ── Supabase ─────────────────────────────────────────────────────────────────
function hdrs(extra={}){
  return {'apikey':CFG.key,'Authorization':`Bearer ${CFG.key}`,
          'Content-Type':'application/json',...extra};
}
async function sbGet(table,params=''){
  const r=await fetch(`${CFG.url}/rest/v1/${table}?${params}`,{headers:hdrs()});
  if(!r.ok) throw new Error(`${table}: ${await r.text()}`);
  return r.json();
}
async function sbUpsert(table,rows,on_conflict=''){
  if(!rows.length) return;
  const url=`${CFG.url}/rest/v1/${table}${on_conflict?'?on_conflict='+on_conflict:''}`;
  const r=await fetch(url,{
    method:'POST',
    headers:hdrs({'Prefer':'resolution=merge-duplicates,return=minimal'}),
    body:JSON.stringify(rows)
  });
  if(!r.ok) throw new Error(`${table}: ${await r.text()}`);
}

// ── Load ─────────────────────────────────────────────────────────────────────
async function loadAll(){
  setSync('⏳');
  try{
    const [groups,students,lessons,att,works,grades,meta]=await Promise.all([
      sbGet('groups',  'order=id.asc'),
      sbGet('students','order=group_id.asc,position.asc'),
      sbGet('lessons', 'order=group_id.asc,date.asc'),
      sbGet('attendance'),
      sbGet('works',   'order=group_id.asc,id.asc'),
      sbGet('grades'),
      sbGet('meta'),
    ]);

    // порог аттестации из meta
    const metaMap=Object.fromEntries(meta.map(r=>[r.key,r.value]));
    ATT_THR=parseInt(metaMap.att_threshold||50);

    const attMap={}, gradeMap={}, gradeMax={};
    att.forEach(r=>{ attMap[`${r.student_id}-${r.lesson_id}`]=r.value; });
    grades.forEach(r=>{ gradeMap[`${r.student_id}-${r.work_id}`]=r.value; });
    works.forEach(w=>{ gradeMax[w.id]=w.max_score; });

    DATA=groups.filter(g=>!g.archived).map(g=>{
      const gid=g.id;
      const stus=students.filter(s=>s.group_id===gid);
      const less=lessons.filter(l=>l.group_id===gid)
                        .sort((a,b)=>a.date.localeCompare(b.date));
      const wrks=works.filter(w=>w.group_id===gid);
      const sids=new Set(stus.map(s=>s.id));
      const lids=new Set(less.map(l=>l.id));
      const wids=new Set(wrks.map(w=>w.id));
      const gAtt={}, gGrd={};
      for(const[k,v]of Object.entries(attMap)){
        const[sid,lid]=k.split('-').map(Number);
        if(sids.has(sid)&&lids.has(lid)) gAtt[k]=v;
      }
      for(const[k,v]of Object.entries(gradeMap)){
        const[sid,wid]=k.split('-').map(Number);
        if(sids.has(sid)&&wids.has(wid)) gGrd[k]=v;
      }
      return{id:gid,name:g.name,
        starosta_id:g.starosta_id,
        students:stus,lessons:less,works:wrks,
        attendance:gAtt,grades:gGrd};
    });

    setSync('✓ '+new Date().toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'}));
    if(GROUP){ GROUP=DATA.find(g=>g.id===GROUP.id)||null; }
    render();
  }catch(e){
    setSync('❌');
    showError(e.message);
  }
}

async function syncNow(){ PENDING={}; await loadAll(); }
function setSync(t){ document.getElementById('navSync').textContent=t; }

// ── Navigation ───────────────────────────────────────────────────────────────
function goBack(){
  GROUP=null; LESSON=null; PENDING={};
  document.getElementById('navBack').classList.remove('show');
  document.getElementById('navTitle').textContent='Журнал';
  document.getElementById('tabs').style.display='none';
  hideSaveBar();
  renderGroupList();
}

function selectGroup(id){
  GROUP=DATA.find(g=>g.id===id);
  LESSON=GROUP.lessons.length ? GROUP.lessons[GROUP.lessons.length-1] : null;
  PENDING={};
  document.getElementById('navBack').classList.add('show');
  document.getElementById('navTitle').textContent=GROUP.name;
  document.getElementById('tabs').style.display='flex';
  // восстановить активный таб
  document.querySelectorAll('.tab').forEach(t=>{
    t.classList.toggle('active', t.dataset.tab===CUR_TAB);
  });
  render();
}

function showTab(tab,el){
  CUR_TAB=tab;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  hideSaveBar();
  render();
}

// ── Render ───────────────────────────────────────────────────────────────────
function render(){
  if(!DATA){ return; }
  if(!GROUP){ renderGroupList(); return; }
  if(CUR_TAB==='att')      renderAttendance();
  else if(CUR_TAB==='grd') renderGrades();
  else                     renderReport();
}

function renderGroupList(){
  if(!DATA){ return; }
  const el=document.getElementById('page');
  el.innerHTML='<div class="section">'+
    DATA.map(g=>`
      <div class="group-card${GROUP&&GROUP.id===g.id?' active':''}" onclick="selectGroup(${g.id})">
        <div>
          <div class="group-name">${g.name}</div>
          <div class="group-meta">${g.students.length} студ. · ${g.lessons.length} зан.</div>
        </div>
        <div class="group-arrow">›</div>
      </div>`).join('')+
  '</div>';
}

// ── Attendance ────────────────────────────────────────────────────────────────
function renderAttendance(){
  if(!GROUP.lessons.length){
    document.getElementById('page').innerHTML='<div class="empty">Нет занятий</div>';
    return;
  }
  const opts=GROUP.lessons.length
    ? GROUP.lessons.slice().reverse().map(l=>
        `<option value="${l.id}"${LESSON&&l.id===LESSON.id?' selected':''}>${fmtDate(l.date)} — ${l.topic}</option>`
      ).join('')
    : '<option value="">— нет занятий —</option>';

  const rows=GROUP.students.map((s,i)=>{
    const key=`${s.id}-${LESSON.id}`;
    const cur=PENDING[key]!==undefined ? PENDING[key] : (GROUP.attendance[key]||'');
    const isStar=GROUP.starosta_id===s.id;
    return `<div class="stu-card">
      <span class="stu-num">${i+1}</span>
      <span class="stu-name">${isStar?'<span class="stu-star">★</span>':''}${s.name}</span>
      <div class="att-wrap">
        ${[['П','ap'],['Н','an'],['О','ao']].map(([v,cls])=>
          `<button class="att-btn${cur===v?' '+cls:''}" onclick="setAtt(${s.id},${LESSON.id},'${v}')">${v}</button>`
        ).join('')}
      </div>
    </div>`;
  }).join('');

  const pCnt=Object.keys(PENDING).length;
  document.getElementById('page').innerHTML=`
    <div class="section">
      <div style="display:flex;gap:8px;margin-bottom:12px;align-items:stretch">
        <div class="lesson-wrap" style="flex:1;margin-bottom:0">
          <select class="lesson-select" onchange="changeLesson(this.value)">${opts}</select>
        </div>
        <button onclick="showAddLesson()" style="flex-shrink:0;padding:0 16px;
          border:none;border-radius:var(--radius);background:var(--accent);
          color:#fff;font-size:22px;cursor:pointer;line-height:1">＋</button>
      </div>
      ${rows}
      <div style="height:80px"></div>
    </div>`;

  // save bar
  if(pCnt>0){
    document.getElementById('saveBtn').textContent=`💾 Сохранить (${pCnt})`;
    showSaveBar();
  } else {
    hideSaveBar();
  }
}

function fmtDate(d){const p=d.split('-');return p[2]+'.'+p[1]+'.'+p[0].slice(2);}

function changeLesson(lid){
  LESSON=GROUP.lessons.find(l=>l.id===parseInt(lid));
  PENDING={};
  renderAttendance();
}

function setAtt(sid,lid,val){
  const key=`${sid}-${lid}`;
  const cur=PENDING[key]!==undefined ? PENDING[key] : (GROUP.attendance[key]||'');
  // повторный клик по активной кнопке — снять отметку
  PENDING[key]= cur===val ? '' : val;
  renderAttendance();
}

async function saveAttendance(){
  const rows=Object.entries(PENDING).map(([k,v])=>{
    const[student_id,lesson_id]=k.split('-').map(Number);
    return{student_id,lesson_id,value:v};
  });
  setSync('⏳');
  try{
    await sbUpsert('attendance',rows,'student_id,lesson_id');
    for(const[k,v]of Object.entries(PENDING)){
      GROUP.attendance[k]=v;
      const g=DATA.find(x=>x.id===GROUP.id);
      if(g) g.attendance[k]=v;
    }
    PENDING={};
    setSync('✓ '+new Date().toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'}));
    hideSaveBar();
    renderAttendance();
  }catch(e){
    setSync('❌');
    alert('Ошибка сохранения: '+e.message);
  }
}

function showSaveBar(){ document.getElementById('saveBar').classList.add('show'); }
function hideSaveBar(){ document.getElementById('saveBar').classList.remove('show'); }

// ── Grades ────────────────────────────────────────────────────────────────────
function pctColor(pct){
  if(pct>=91) return ['var(--good-bg)','var(--good-fg)'];
  if(pct>=76) return ['var(--green-bg)','var(--green-fg)'];
  if(pct>=61) return ['var(--amber-bg)','var(--amber-fg)'];
  return ['var(--red-bg)','var(--red-fg)'];
}

function renderGrades(){
  if(!GROUP.works.length){
    document.getElementById('page').innerHTML='<div class="empty">Нет работ</div>';
    return;
  }
  const thead=`<tr>
    <th>#</th><th>Студент</th>
    ${GROUP.works.map(w=>`<th>${w.name}<br><span style="font-weight:400">${w.max_score}б</span></th>`).join('')}
    <th>Σ</th>
  </tr>`;

  const tbody=GROUP.students.map((s,i)=>{
    const isStar=GROUP.starosta_id===s.id;
    let sum=0,maxSum=0;
    const cells=GROUP.works.map(w=>{
      const v=GROUP.grades[`${s.id}-${w.id}`];
      const ms=Number(w.max_score)||100;
      maxSum+=ms;
      if(v!=null){
        const n=Number(v); sum+=n;
        const pct=ms>0?Math.round(n/ms*100):0;
        const[bg,fg]=pctColor(pct);
        return `<td><span class="badge" style="background:${bg};color:${fg}">${v}</span></td>`;
      }
      return `<td style="color:var(--fg3)">—</td>`;
    }).join('');
    const hasSome=sum>0||GROUP.works.some(w=>GROUP.grades[`${s.id}-${w.id}`]!=null);
    let sumCell='<td style="color:var(--fg3)">—</td>';
    if(hasSome){
      const pct=maxSum>0?Math.round(sum/maxSum*100):0;
      const[bg,fg]=pctColor(pct);
      sumCell=`<td><span class="badge" style="background:${bg};color:${fg};font-size:13px">${sum}</span></td>`;
    }
    return `<tr>
      <td style="color:var(--fg3);font-size:13px">${i+1}</td>
      <td>${isStar?'<span class="stu-star">★</span>':''}${s.name}</td>
      ${cells}${sumCell}
    </tr>`;
  }).join('');

  document.getElementById('page').innerHTML=`
    <div class="section" style="padding-bottom:0">
      <div class="grades-wrap">
        <table class="grades-table"><thead>${thead}</thead><tbody>${tbody}</tbody></table>
      </div>
    </div>`;
}

// ── Add Lesson (mobile) ──────────────────────────────────────────────────────
function showAddLesson(){
  // простой диалог поверх страницы
  const today=new Date().toISOString().slice(0,10);
  const overlay=document.createElement('div');
  overlay.id='lessonOverlay';
  overlay.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;'
    +'display:flex;align-items:flex-end;padding-bottom:var(--safe-b)';
  overlay.innerHTML=`
    <div style="background:var(--card);border-radius:20px 20px 0 0;padding:20px 16px;
                width:100%;box-shadow:0 -4px 20px rgba(0,0,0,.15)">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <span style="font-size:17px;font-weight:700">Новое занятие</span>
        <span onclick="closeAddLesson()" style="font-size:24px;color:var(--fg2);cursor:pointer">✕</span>
      </div>
      <div class="cfg-label">Дата</div>
      <input class="cfg-input" id="newLesDate" type="date" value="${today}">
      <div class="cfg-label">Тема</div>
      <input class="cfg-input" id="newLesTopic" type="text" placeholder="Тема занятия">
      <button class="cfg-btn" style="margin-top:14px" onclick="addLesson()">Добавить</button>
    </div>`;
  document.body.appendChild(overlay);
  setTimeout(()=>document.getElementById('newLesTopic').focus(),100);
}

function closeAddLesson(){
  const o=document.getElementById('lessonOverlay');
  if(o) o.remove();
}

async function addLesson(){
  const d=document.getElementById('newLesDate').value.trim();
  const t=document.getElementById('newLesTopic').value.trim()||'Занятие';
  if(!d){ alert('Введите дату'); return; }

  // получаем следующий id из meta
  setSync('⏳');
  try{
    const metaRows=await sbGet('meta','key=eq.nli');
    let nli=parseInt(metaRows[0]?.value||1);
    const lid=nli; nli++;

    // обновить meta
    await sbUpsert('meta',[{key:'nli',value:String(nli)}]);

    // вставить занятие
    await sbUpsert('lessons',[{id:lid,group_id:GROUP.id,date:d,topic:t}]);

    setSync('✓');
    closeAddLesson();
    // перезагрузить данные
    await loadAll();
    if(GROUP){
      GROUP=DATA.find(g=>g.id===GROUP.id);
      LESSON=GROUP.lessons.find(l=>l.id===lid)||GROUP.lessons[GROUP.lessons.length-1];
      renderAttendance();
    }
  }catch(e){
    setSync('❌');
    alert('Ошибка: '+e.message);
  }
}

// ── Attestation Report ────────────────────────────────────────────────────────
function monthKey(d){ return d.slice(0,7); }
const MONTHS=['Январь','Февраль','Март','Апрель','Май','Июнь',
              'Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
function monthLabel(ym){
  const[y,m]=ym.split('-'); return MONTHS[parseInt(m)-1]+' '+y;
}

function renderReport(){
  if(!GROUP.lessons.length){
    document.getElementById('page').innerHTML='<div class="empty">Нет занятий</div>';
    return;
  }

  const months=[...new Set(GROUP.lessons.map(l=>monthKey(l.date)))].sort();

  const sections=months.map(m=>{
    const mLessons=GROUP.lessons.filter(l=>monthKey(l.date)===m);
    const rows=GROUP.students.map((s,i)=>{
      const isStar=GROUP.starosta_id===s.id;
      const absent=mLessons.filter(l=>(GROUP.attendance[`${s.id}-${l.id}`]||'')==='Н').length;
      const total=mLessons.length;
      const pct=total?Math.round(absent/total*100):0;
      const fail=pct>ATT_THR;
      const[bg,fg]=fail?['var(--red-bg)','var(--red-fg)']:['var(--green-bg)','var(--green-fg)'];
      const label=total===0?'—':fail?'✗ Неатт.':'✓ Атт.';
      return `<div class="att-row">
        <span class="stu-num" style="color:var(--fg3)">${i+1}</span>
        <span class="stu-name">${isStar?'<span class="stu-star">★</span>':''}${s.name}</span>
        <div class="att-cell">
          <div style="font-size:12px;color:var(--fg2);margin-bottom:3px">${absent}/${total} (${pct}%)</div>
          <span class="badge" style="background:${bg};color:${fg}">${label}</span>
        </div>
      </div>`;
    }).join('');

    const failCount=GROUP.students.filter(s=>{
      const abs=mLessons.filter(l=>(GROUP.attendance[`${s.id}-${l.id}`]||'')==='Н').length;
      return mLessons.length&&(abs/mLessons.length*100)>ATT_THR;
    }).length;

    return `<div class="month-section">
      <div class="month-title">${monthLabel(m)}
        ${failCount?`<span style="color:var(--red-fg);font-weight:400;text-transform:none;font-size:12px;margin-left:8px">
          ${failCount} неаттест.</span>`:''}
      </div>
      ${rows}
    </div>`;
  }).join('');

  document.getElementById('page').innerHTML=`
    <div class="section">
      <div style="background:var(--accent-bg);color:var(--accent);border-radius:var(--radius-sm);
                  padding:10px 14px;font-size:13px;margin-bottom:14px">
        📌 Неаттестация: пропуски &gt; ${ATT_THR}% занятий в месяце
      </div>
      ${sections}
    </div>`;
}

// ── Config ────────────────────────────────────────────────────────────────────
function showConfig(){
  document.getElementById('tabs').style.display='none';
  document.getElementById('navBack').classList.remove('show');
  document.getElementById('navTitle').textContent='Настройки';
  document.getElementById('page').innerHTML=`
    <div class="cfg-wrap">
      <div class="cfg-card">
        <h2>⚙️ Подключение</h2>
        <p>Данные из Settings → API вашего Supabase-проекта.</p>
        <div class="cfg-label">Project URL</div>
        <input class="cfg-input" id="cfgUrl" type="url"
          placeholder="https://xxxx.supabase.co" value="${CFG.url||''}">
        <div class="cfg-label">anon public key</div>
        <input class="cfg-input" id="cfgKey" type="text"
          placeholder="eyJ..." value="${CFG.key||''}">
        <button class="cfg-btn" onclick="saveConfig()">Сохранить и подключиться</button>
      </div>
    </div>`;
}

function saveConfig(){
  CFG={
    url:document.getElementById('cfgUrl').value.trim().replace(/\/$/,''),
    key:document.getElementById('cfgKey').value.trim()
  };
  localStorage.setItem(CFG_KEY,JSON.stringify(CFG));
  document.getElementById('navTitle').textContent='Журнал';
  loadAll();
}

function showError(msg){
  document.getElementById('page').innerHTML=`
    <div class="section">
      <div style="background:var(--red-bg);color:var(--red-fg);border-radius:var(--radius);
                  padding:16px;font-size:14px;line-height:1.5">
        <b>Ошибка загрузки</b><br>${msg}
      </div>
    </div>`;
}

// ── Long-press navbar title → config ─────────────────────────────────────────
let pressTimer;
document.getElementById('navTitle').addEventListener('pointerdown',
  ()=>{ pressTimer=setTimeout(showConfig,900); });
document.getElementById('navTitle').addEventListener('pointerup',
  ()=>clearTimeout(pressTimer));
document.getElementById('navTitle').addEventListener('pointerleave',
  ()=>clearTimeout(pressTimer));

// ── Start ─────────────────────────────────────────────────────────────────────
if(CFG.url&&CFG.key) loadAll();
else showConfig();
</script>
</body>
